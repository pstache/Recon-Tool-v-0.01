# SpareBank 1 brand theme.
#
# Streamlit reads this on startup. It governs the global palette: primary
# action color, background, secondary surfaces, body text, and the default
# UI font. Anything not covered here (button radius, sidebar accents, etc.)
# is layered on via the small CSS block in ui/branding.py — see that module
# for the rationale.
#
# The palette is the SB1 primærpalett with Vann as the primary action color
# (per the design system: "SpareBank 1 skal alltid ha et blått etterlatt
# inntrykk").

[theme]
# Primary action color — buttons, focus rings, sliders, progress bars.
# Vann.
primaryColor = "#005AA4"

# App background. Hvit per the design system's light-mode default.
backgroundColor = "#FFFFFF"

# Secondary surface (sidebar, expanders, code blocks). Sand — the lightest
# of the primary palette, gives a warm SB1 feel without clashing with Vann.
secondaryBackgroundColor = "#F8E9DD"

# Body text. Natt is the dark navy from the neutrals — same family as the
# blues, so the page reads as one tonal world.
textColor = "#001032"

# Default font. SpareBank 1 Title / SpareBank 1 Regular aren't web-safe, so
# we fall through to Nunito (closest free geometric sans with the same
# circular letterform character) and finally to system sans-serif.
font = "sans serif"

[client]
# Hide the "Made with Streamlit" footer and the hamburger dev menu — this
# is an internal tool, not a Streamlit demo.
toolbarMode = "minimal"
